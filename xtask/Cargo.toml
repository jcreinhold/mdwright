[package]
edition = "2024"
name = "xtask"
publish = false
version = "0.0.0"

[lib]
doctest = false
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
comrak = { version = "0.52", default-features = false }
ignore = { workspace = true }
mdwright-config = { workspace = true }
mdwright-document = { workspace = true }
mdwright-format = { workspace = true }
mdwright-latex = { workspace = true }
mdwright-lint = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
