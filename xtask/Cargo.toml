[package]
edition = "2024"
name = "xtask"
publish = false
version = "0.0.0"

[lib]
doctest = false
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.52", default-features = false }
mdwright-config = { path = "../crates/mdwright-config" }
mdwright-document = { path = "../crates/mdwright-document" }
mdwright-format = { path = "../crates/mdwright-format" }
mdwright-lint = { path = "../crates/mdwright-lint" }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
toml = { version = "0.8", default-features = false, features = ["parse"] }
