[package]
authors = ["Jacob Reinhold <jcreinhold@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "A math-resilient Markdown linter and round-trip formatter"
documentation = "https://docs.rs/mdwright"
edition = "2024"
homepage = "https://jcreinhold.github.io/mdwright"
include = [
  "src/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "CHANGELOG.md",
]
keywords = ["documentation", "linter", "markdown", "math"]
license = "MIT OR Apache-2.0"
name = "mdwright"
readme = "README.md"
repository = "https://github.com/jcreinhold/mdwright"
rust-version = "1.91"
version = "0.1.0"

[package.metadata.binstall]
bin-dir = "mdwright-{ target }/mdwright"
pkg-fmt = "txz"
pkg-url = "{ repo }/releases/download/v{ version }/mdwright-{ target }.tar.xz"

[[bin]]
name = "mdwright"
path = "src/bin/mdwright.rs"

[lib]
path = "src/lib.rs"

[dependencies]
mdwright-cli = { workspace = true }
mdwright-config = { workspace = true }
mdwright-document = { workspace = true }
mdwright-format = { workspace = true }
mdwright-lint = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
mdwright-lsp = { workspace = true }
proptest = "1"
pulldown-cmark = { workspace = true, default-features = false }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
toml = { workspace = true }
tower-lsp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = "0.4"
walkdir = "2"
xtask = { path = "xtask" }

[[bench]]
harness = false
name = "lint_bench"

[[bench]]
harness = false
name = "format_bench"

[[bench]]
harness = false
name = "incremental"

[[bench]]
harness = false
name = "parse_format"

[workspace]
exclude = ["fuzz"]
members = [
  ".",
  "crates/mdwright-cli",
  "crates/mdwright-config",
  "crates/mdwright-document",
  "crates/mdwright-format",
  "crates/mdwright-lint",
  "crates/mdwright-lsp",
  "crates/mdwright-math",
  "examples/extending",
  "xtask",
]

[workspace.package]
authors = ["Jacob Reinhold <jcreinhold@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["documentation", "linter", "markdown", "math"]
readme = "README.md"
repository = "https://github.com/jcreinhold/mdwright"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["color", "derive"] }
ignore = "0.4"
mdwright-cli = { path = "crates/mdwright-cli" }
mdwright-config = { path = "crates/mdwright-config" }
mdwright-document = { path = "crates/mdwright-document" }
mdwright-format = { path = "crates/mdwright-format" }
mdwright-lint = { path = "crates/mdwright-lint" }
mdwright-lsp = { path = "crates/mdwright-lsp" }
mdwright-math = { path = "crates/mdwright-math" }
owo-colors = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
rayon = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "smallvec",
  "tracing-log",
] }
unicode-width = "0.2"

[lints]
workspace = true

[workspace.lints.rust]
future-incompatible = "warn"
let-underscore = "warn"
nonstandard-style = "warn"
redundant_lifetimes = "warn"
rust-2018-idioms = "warn"
rust-2024-compatibility = "deny"
single_use_lifetimes = "warn"
trivial_casts = "warn"
unreachable_pub = "warn"
unsafe-code = "forbid"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# --- correctness & bug prevention ---
all = { level = "warn", priority = -10 }
complexity = { level = "warn", priority = -9 }
correctness = { level = "warn", priority = -8 }
suspicious = { level = "warn", priority = -7 }

# --- performance ---
clone_on_ref_ptr = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_memcpy = "warn"
perf = { level = "warn", priority = -6 }
redundant_clone = "warn"

# --- style ---
nursery = { level = "warn", priority = -5 }
pedantic = { level = "warn", priority = -4 }
style = { level = "warn", priority = -3 }

# --- safety & reliability ---
arithmetic_side_effects = "deny"
exit = "warn"
expect_used = "deny"
get_unwrap = "warn"
indexing_slicing = "deny"
mem_forget = "deny"
mutex_integer = "warn"
panic = "deny"
ptr_as_ptr = "warn"
rc_mutex = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "deny"
wildcard_enum_match_arm = "warn"

# --- documentation ---
blanket_clippy_restriction_lints = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

# --- cargo ---
cargo = { level = "warn", priority = -1 }
lint_groups_priority = "warn"

# --- allowable exceptions (mirror workspace) ---
items_after_statements = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
# Trait-method impls return `&str` even when the body is a literal,
# because the trait signature is `&str` (not `&'static str`) so
# user rules can return borrows from `self`. The lint fires on every
# rule impl; suppress at crate level.
redundant_pub_crate = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
unnecessary_literal_bound = "allow"
unnecessary_wraps = "allow"

# --- numerical reasons ---
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_arithmetic = "allow"

# --- additional safety ---
disallowed_methods = "deny"
disallowed_types = "deny"
implicit_clone = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
