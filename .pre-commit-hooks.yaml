# Hook definitions for the `pre-commit` framework
# (https://pre-commit.com). Two flavours per command:
#
# - source-build hooks invoke `cargo run -p mdwright-cli` from the
#   checked-out repository. First run is slow (~30s); subsequent runs
#   reuse Cargo's cache.
# - `*-system` variants assume `mdwright` is already on `$PATH`
#   (installed via `cargo binstall mdwright-cli`, a GitHub release
#   tarball, or a package manager). No build, no Rust toolchain
#   needed.
#
# Downstream users add this repo to `.pre-commit-config.yaml`:
#
#   repos:
#     - repo: https://github.com/jcreinhold/mdwright
#       rev: v0.1.0
#       hooks:
#         - id: mdwright-check
#         - id: mdwright-fmt-check
#
# Pick `-system` variants if Rust is unwelcome on contributor
# machines.

- id: mdwright-check
  name: mdwright check
  description: Lint Markdown files with mdwright (fails the commit on non-advisory diagnostics)
  entry: cargo run --quiet -p mdwright-cli -- check --check
  language: system
  types_or: [markdown]

- id: mdwright-fmt
  name: mdwright fmt
  description: Reformat Markdown files in place
  entry: cargo run --quiet -p mdwright-cli -- fmt
  language: system
  types_or: [markdown]

- id: mdwright-fmt-check
  name: mdwright fmt-check
  description: Verify Markdown files are mdwright-formatted (no writes)
  entry: cargo run --quiet -p mdwright-cli -- fmt-check
  language: system
  types_or: [markdown]

- id: mdwright-check-system
  name: mdwright check (system PATH)
  description: Lint Markdown files with the mdwright binary already on $PATH
  entry: mdwright check --check
  language: system
  types_or: [markdown]

- id: mdwright-fmt-system
  name: mdwright fmt (system PATH)
  description: Reformat Markdown files with the mdwright binary already on $PATH
  entry: mdwright fmt
  language: system
  types_or: [markdown]

- id: mdwright-fmt-check-system
  name: mdwright fmt-check (system PATH)
  description: Verify formatting with the mdwright binary already on $PATH
  entry: mdwright fmt-check
  language: system
  types_or: [markdown]
