# mdwright dogfoods itself: this config governs `mdwright check` and
# `mdwright fmt` on the repo's own Markdown.

[fmt]
wrap = 120

# Auto-generated pages — owned by `cargo xtask doc-rules` /
# `cargo xtask doc-cli` / `build.rs`. The drift tests are the source
# of truth; the formatter must not rewrite them or the two gates
# disagree.
exclude = [
  "docs/src/configuration.md",
  "docs/src/reference/cli.md",
  "docs/src/reference/diagnostic-schema.md",
  "docs/src/rules/**",
  "tests/gfm-spec/**",
]

[lint]
exclude = [
  # Per-rule pages necessarily contain rule-violating examples in
  # their "Example (bad)" sections — linting them is incoherent.
  "docs/src/rules/**",
  "tests/gfm-spec/**",
]
