name: Release recovery

# Idempotent completion of a PARTIAL release. The happy path is the tag-driven
# `release.yml`, which runs `cargo publish --workspace`. That single command
# uploads the publishable workspace members in dependency order, but it is all-
# or-nothing on re-run: once any crate version is on the index, re-invoking it
# fails with `crate <name>@<ver> already exists on crates.io index` before it can
# reach the crates that did NOT upload (e.g. a tail crate that lost cargo's
# index-propagation race).
#
# This workflow recovers from that state WITHOUT burning a version. It walks the
# crates in dependency order, skips any already on crates.io at the requested
# version, and publishes only the missing ones one at a time (so each upload is
# in the index before the next crate's verify build resolves it). It is safe to
# re-run: a fully published version is a no-op.
#
# It does NOT touch the GitHub Release: under the decoupled release.yml the binary
# Release and docs deploy are the cargo-dist `host` job's concern and run
# independently of crates.io publish, so recovery is purely crates.io gap-filling.
#
# Manual trigger only. `version` must equal the workspace version (the crate
# contents on this ref are what get uploaded). crates.io versions are immutable,
# so this never overwrites — it only fills gaps.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to complete, without the leading v (e.g. 0.1.0). Must match the workspace version."
        type: string
        required: true
      dry_run:
        description: "Verify-build the missing crates with --dry-run; do not upload."
        type: boolean
        default: false

concurrency:
  # Never let two recovery runs (or a recovery and the tag release) publish the
  # same version concurrently.
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  recover:
    name: Recover v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify input version matches workspace
        run: |
          set -euo pipefail
          wsver="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="mdwright"))')"
          if [ "${{ inputs.version }}" != "$wsver" ]; then
            echo "::error::Requested version ${{ inputs.version }} != workspace version $wsver. Recovery uploads the crate contents on this ref; check out the matching commit or fix the input."
            exit 1
          fi
          echo "Workspace version $wsver matches requested version."

      - name: Publish missing crates (idempotent, dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          dry="${{ inputs.dry_run }}"
          # Dependency (topological) order — the same list release.yml's public-
          # API diff iterates, which is a valid publish order.
          crates="mdwright-latex mdwright-math mdwright-mathrender mdwright-document mdwright-format mdwright-lint mdwright-config mdwright-lsp mdwright"
          published=0
          skipped=0
          for c in $crates; do
            # crates.io returns 2xx for an existing version, 404 otherwise.
            if curl -sf -o /dev/null \
                 -H "User-Agent: mdwright-release-recover (github.com/jcreinhold/mdwright)" \
                 "https://crates.io/api/v1/crates/$c/$version"; then
              echo "✓ $c@$version already on crates.io — skipping"
              skipped=$((skipped + 1))
              continue
            fi
            echo "→ $c@$version is missing — publishing"
            if [ "$dry" = "true" ]; then
              cargo publish -p "$c" --locked --dry-run
            else
              # Single-crate publish waits for the upload to land in the index
              # before returning, so the next crate's verify build resolves it.
              cargo publish -p "$c" --locked
            fi
            published=$((published + 1))
          done
          echo "Recovery summary: published=$published skipped=$skipped (dry_run=$dry)"
          if [ "$dry" != "true" ] && [ "$published" = "0" ]; then
            echo "Nothing to publish — $version was already complete on crates.io."
          fi
