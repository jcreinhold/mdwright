name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run all gates but skip crates.io publish and GitHub Release creation.'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: 1.7.12
  CARGO_PUBLIC_API_VERSION: 0.51.0
  MDBOOK_VERSION: '0.5.3'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,mdbook@0.5.3

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version "$CARGO_PUBLIC_API_VERSION" --locked

      - name: Install Rust nightly for cargo-public-api
        run: rustup toolchain install nightly --profile minimal

      - name: actionlint workflows
        run: actionlint .github/workflows/*.yml

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo nextest run
        run: cargo nextest run --workspace --release --locked

      - name: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Verify generated docs
        run: |
          cargo xtask doc-rules --check
          cargo xtask doc-cli --check
          cargo xtask doc-config --check

      - name: Build mdBook
        run: mdbook build docs/

      - name: Public API diff vs committed baselines
        run: |
          set -euo pipefail
          for crate in mdwright-latex mdwright-math mdwright-mathrender mdwright-document mdwright-format mdwright-lint mdwright-config mdwright-lsp mdwright; do
            baseline="docs/api-review/${crate}-public.txt"
            if [ ! -f "$baseline" ]; then
              echo "::error::Missing public API baseline: $baseline"
              exit 1
            fi
            actual="$(mktemp)"
            cargo public-api --simplified -p "$crate" > "$actual"
            if ! diff -u "$baseline" "$actual"; then
              echo "::error::Public API drift for $crate. Regenerate $baseline with scripts/update-api-review.sh."
              exit 1
            fi
          done

      - name: Package tarball docs.rs simulation
        run: python3 scripts/check_package_docsrs.py

  dist-plan:
    needs: verify
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.release.outputs.tag }}
      tag-flag: ${{ steps.release.outputs.tag_flag }}
      publishing: ${{ steps.release.outputs.publishing }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="mdwright"))')"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            expected="v${version}"
            if [ "$tag" != "$expected" ]; then
              echo "::error::Tag $tag does not match workspace version $version; expected $expected."
              exit 1
            fi
            publishing=true
          else
            tag="v${version}"
            publishing=false
          fi
          {
            echo "tag=$tag"
            echo "tag_flag=--tag=$tag"
            echo "publishing=$publishing"
          } >> "$GITHUB_OUTPUT"

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        run: |
          dist host --allow-dirty --steps=create "${{ steps.release.outputs.tag_flag }}" --output-format=json > plan-dist-manifest.json
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: dist-plan
    if: ${{ fromJson(needs.dist-plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dist-plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Install dependencies
        run: ${{ matrix.packages_install }}

      - name: Build artifacts
        run: |
          dist build --allow-dirty ${{ needs.dist-plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs:
      - dist-plan
      - build-local-artifacts
    if: ${{ always() && needs.dist-plan.result == 'success' && (needs.build-local-artifacts.result == 'success' || needs.build-local-artifacts.result == 'skipped') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        run: |
          dist build --allow-dirty ${{ needs.dist-plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  publish-crates:
    needs:
      - dist-plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.dist-plan.result == 'success' && (needs.build-local-artifacts.result == 'success' || needs.build-local-artifacts.result == 'skipped') && (needs.build-global-artifacts.result == 'success' || needs.build-global-artifacts.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PUBLISHING: ${{ needs.dist-plan.outputs.publishing }}
      RELEASE_TAG: ${{ needs.dist-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify crates.io token is configured for live publish
        run: |
          set -euo pipefail
          if [ "$PUBLISHING" = "true" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured."
            exit 1
          fi

      - name: Verify changelog section
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG section for [$version]; add one before tagging."
            exit 1
          fi

      - name: Package tarball docs.rs simulation
        run: python3 scripts/check_package_docsrs.py

      - name: Publish workspace to crates.io
        run: |
          set -euo pipefail
          # cargo publish --workspace uploads the publishable members (xtask and
          # examples/extending are publish=false) in dependency order and waits
          # for each crate to land in the index before the next verify build, so
          # no manual ordering or inter-crate sleep is needed. It is all-or-
          # nothing on re-run; a partial publish is finished by release-recover.yml.
          if [ "$PUBLISHING" != "true" ]; then
            cargo publish --workspace --locked --dry-run
          else
            cargo publish --workspace --locked
          fi

  host:
    # Decoupled from publish-crates: the binary GitHub Release is the cargo-dist
    # host job's own concern, so a transient crates.io failure never blocks the
    # binary release or the docs deploy. crates.io is repaired by
    # release-recover.yml without rebuilding anything here.
    needs:
      - dist-plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.dist-plan.result == 'success' && needs.dist-plan.outputs.publishing == 'true' && (needs.build-local-artifacts.result == 'success' || needs.build-local-artifacts.result == 'skipped') && (needs.build-global-artifacts.result == 'success' || needs.build-global-artifacts.result == 'skipped') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        run: |
          dist host --allow-dirty ${{ needs.dist-plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Cleanup granular manifests
        run: rm -f artifacts/*-dist-manifest.json

      - name: Create GitHub Release
        env:
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          PRERELEASE_FLAG: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          args=()
          if [ -n "$PRERELEASE_FLAG" ]; then
            args+=("$PRERELEASE_FLAG")
          fi
          gh release create "${{ needs.dist-plan.outputs.tag }}" --target "$RELEASE_COMMIT" "${args[@]}" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  trigger-pages:
    needs:
      - dist-plan
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.dist-plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.dist-plan.outputs.tag }}
    steps:
      - name: Trigger Pages deployment
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_ref="$RELEASE_TAG"
