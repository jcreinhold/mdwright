[package]
edition = "2024"
name = "mdwright-fuzz"
publish = false
version = "0.0.0"

# Stand-alone workspace: the root `[workspace]` table excludes `fuzz`, but
# cargo still walks upward and refuses to build without an explicit marker
# here. Keep this empty so the fuzz crate resolves only its own dependencies.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
mdwright-document = { path = "../crates/mdwright-document" }
mdwright-format = { path = "../crates/mdwright-format" }
mdwright-latex = { path = "../crates/mdwright-latex" }
mdwright-lint = { path = "../crates/mdwright-lint" }
mdwright-math = { path = "../crates/mdwright-math" }

[[bin]]
bench = false
doc = false
name = "fuzz_parse_format"
path = "fuzz_targets/fuzz_parse_format.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_idempotence"
path = "fuzz_targets/fuzz_idempotence.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_lint"
path = "fuzz_targets/fuzz_lint.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_verbatim_identity"
path = "fuzz_targets/fuzz_verbatim_identity.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_structured_idempotence"
path = "fuzz_targets/fuzz_structured_idempotence.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_latex_render"
path = "fuzz_targets/fuzz_latex_render.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_latex_translate"
path = "fuzz_targets/fuzz_latex_translate.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_markdown_math_translate"
path = "fuzz_targets/fuzz_markdown_math_translate.rs"
test = false
