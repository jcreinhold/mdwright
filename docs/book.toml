[book]
authors = ["Jacob Reinhold"]
description = "Math-resilient Markdown linter and round-trip formatter."
language = "en"
src = "src"
title = "mdwright"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
edit-url-template = "https://github.com/jcreinhold/mdwright/edit/main/docs/{path}"
git-repository-url = "https://github.com/jcreinhold/mdwright"
preferred-dark-theme = "ayu"

[output.html.search]
enable = true
limit-results = 25
use-boolean-and = true
